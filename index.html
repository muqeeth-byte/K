<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Krishnaja R Nair — Finance, HR &amp; Education Professional</title>
<meta name="description" content="Krishnaja R Nair is a postgraduate in education and BBA graduate in Finance &amp; HR, targeting analyst, operations, HR and ed-tech roles. Based in Hyderabad, India." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  /* ---------- Design tokens (same palette as the original) ---------- */
  :root {
    --background: hsl(38 33% 97%);
    --foreground: hsl(222 32% 11%);
    --card: #ffffff;
    --muted: hsl(222 16% 93%);
    --muted-fg: hsl(222 10% 40%);
    --accent: hsl(186 52% 30%);
    --border: hsl(222 16% 87%);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Archivo", sans-serif;
    background: var(--background);
    color: var(--foreground);
    overflow-x: clip;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  ::selection { background: var(--accent); color: var(--background); }
  a { color: inherit; text-decoration: none; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  h1, h2, h3, p, dl, dd { margin: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  .font-display { font-family: "Fraunces", serif; }
  .font-mono { font-family: "Space Mono", monospace; }
  .wrap { max-width: 72rem; margin: 0 auto; padding: 0 1rem; }
  @media (min-width: 640px) { .wrap { padding: 0 1.5rem; } }
  .ic { width: 16px; height: 16px; flex-shrink: 0; }
  .ic-lg { width: 20px; height: 20px; flex-shrink: 0; }
  .ic-xl { width: 24px; height: 24px; flex-shrink: 0; }

  /* ---------- Header ---------- */
  .site-header {
    position: sticky; top: 0; z-index: 50;
    border-bottom: 1px solid hsl(222 16% 87% / 0.7);
    background: hsl(38 33% 97% / 0.8);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
  @media (min-width: 640px) { .header-inner { padding: 12px 24px; } }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-name { display: none; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
  @media (min-width: 640px) { .brand-name { display: inline; } }
  .monogram {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--foreground); color: var(--background);
    font-size: 14px; font-weight: 900; letter-spacing: -0.02em;
  }
  .nav-desktop { display: none; align-items: center; gap: 4px; }
  @media (min-width: 1024px) { .nav-desktop { display: flex; } }
  .nav-desktop a, .footer-nav a {
    padding: 8px 12px; border-radius: 6px;
    font-size: 14px; font-weight: 500; color: var(--muted-fg);
    transition: color .2s;
  }
  .nav-desktop a:hover, .footer-nav a:hover { color: var(--foreground); }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .btn-pill {
    display: inline-flex; align-items: center; gap: 8px;
    border-radius: 999px; font-weight: 700; font-size: 14px;
    transition: all .2s; cursor: pointer; border: 1px solid transparent;
  }
  .btn-pill:active { transform: scale(.98); }
  .btn-dark { background: var(--foreground); color: var(--background); padding: 10px 20px; font-weight: 600; }
  .btn-dark:hover { background: var(--accent); color: var(--background); }
  .btn-outline { border-color: var(--border); background: transparent; color: var(--foreground); padding: 14px 24px; font-weight: 700; }
  .btn-outline:hover { background: var(--muted); }
  .btn-hide-mobile { display: none; }
  @media (min-width: 640px) { .btn-hide-mobile { display: inline-flex; } }
  .menu-btn {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 8px;
    border: 1px solid var(--border); background: transparent; color: var(--foreground); cursor: pointer;
  }
  .menu-btn:hover { background: var(--muted); }
  @media (min-width: 1024px) { .menu-btn { display: none; } }

  /* Mobile sheet */
  .sheet-overlay {
    position: fixed; inset: 0; z-index: 60;
    background: hsl(0 0% 0% / 0.8);
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .sheet-overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 61;
    width: 75%; max-width: 384px; padding: 24px;
    background: var(--background); color: var(--foreground);
    border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform .3s ease;
    overflow-y: auto;
  }
  .sheet.open { transform: translateX(0); }
  .sheet-close {
    position: absolute; top: 16px; right: 16px;
    background: none; border: 0; cursor: pointer; color: var(--foreground);
  }
  .sheet-links { margin-top: 40px; display: flex; flex-direction: column; gap: 4px; }
  .sheet-links a {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0; border-bottom: 1px solid var(--border);
    font-family: "Fraunces", serif; font-size: 24px; font-weight: 700; letter-spacing: -0.01em;
  }
  .sheet-links a:hover { color: var(--accent); }
  .sheet-cta {
    margin-top: 24px; justify-content: center;
    background: var(--foreground); color: var(--background);
    padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 14px;
    display: flex; align-items: center; gap: 8px;
  }

  /* ---------- Hero ---------- */
  .hero { position: relative; overflow: hidden; }
  .grid-lines {
    position: absolute; inset: 0; pointer-events: none; opacity: .6;
    background-image:
      linear-gradient(to right, hsl(222 32% 11% / 0.05) 1px, transparent 1px),
      linear-gradient(to bottom, hsl(222 32% 11% / 0.05) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .hero-inner { position: relative; padding: 56px 0 64px; }
  @media (min-width: 640px) { .hero-inner { padding: 80px 0 96px; } }
  .hero-grid { display: grid; align-items: center; gap: 40px; }
  @media (min-width: 1024px) { .hero-grid { grid-template-columns: 1.15fr 0.85fr; } }

  .eyebrow-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px;
    margin-bottom: 20px;
    font-family: "Space Mono", monospace; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .15em; color: var(--accent);
  }
  .eyebrow-row .item { display: flex; align-items: center; gap: 6px; }
  .eyebrow-row .item.muted { color: var(--foreground); opacity: .7; }
  .eyebrow-row .sep { color: var(--muted-fg); }
  .ping { position: relative; display: inline-flex; width: 8px; height: 8px; }
  .ping::before, .ping::after {
    content: ""; position: absolute; inset: 0; border-radius: 999px; background: var(--accent);
  }
  .ping::before { opacity: .6; animation: ping 1.4s cubic-bezier(0,0,.2,1) infinite; }
  .ping::after { position: relative; }
  @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }

  .hero h1 {
    font-family: "Fraunces", serif; font-weight: 900;
    font-size: 48px; line-height: .98; letter-spacing: -0.03em;
  }
  @media (min-width: 640px) { .hero h1 { font-size: 72px; } }
  .hero-sub {
    margin-top: 16px; font-family: "Fraunces", serif; font-weight: 500;
    font-size: 20px; line-height: 1.375; color: hsl(222 32% 11% / 0.8);
  }
  @media (min-width: 640px) { .hero-sub { font-size: 24px; } }
  .hero-lede {
    margin-top: 24px; max-width: 36rem;
    font-size: 16px; line-height: 1.625; color: var(--muted-fg);
  }
  @media (min-width: 640px) { .hero-lede { font-size: 18px; } }
  .chips { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border); background: var(--card);
    border-radius: 999px; padding: 6px 14px;
    font-size: 12px; font-weight: 600; color: hsl(222 32% 11% / 0.8);
  }
  .cta-row { margin-top: 36px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }

  .glance {
    border: 1px solid var(--border); background: var(--card);
    border-radius: 16px; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  @media (min-width: 640px) { .glance { padding: 28px; } }
  .label {
    display: flex; align-items: center; gap: 8px; margin-bottom: 20px;
    font-family: "Space Mono", monospace; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .15em; color: var(--muted-fg);
  }
  .label .ic { color: var(--accent); }
  .glance dl > div { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .glance dl > div:first-child { border-top: 0; }
  .glance dt {
    font-family: "Space Mono", monospace; font-size: 10px; text-transform: uppercase;
    letter-spacing: .15em; color: var(--muted-fg);
  }
  .glance dd { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .glance .ic { margin-top: 2px; color: var(--accent); }
  .glance a:hover { color: var(--accent); }

  /* ---------- Stats ---------- */
  .stats { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: hsl(0 0% 100% / 0.5); }
  .stats-grid { max-width: 72rem; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; }
  @media (min-width: 1024px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
  .stat { padding: 32px 20px; border-left: 1px solid var(--border); }
  .stat:nth-child(odd) { border-left: 0; }
  @media (min-width: 1024px) { .stat { border-left: 1px solid var(--border); padding: 40px 24px; } .stat:first-child { border-left: 0; } }
  .stat:nth-child(n+3) { border-top: 1px solid var(--border); }
  @media (min-width: 1024px) { .stat:nth-child(n+3) { border-top: 0; } }
  @media (min-width: 640px) { .stat { padding-top: 40px; padding-bottom: 40px; } }
  .stat-value { font-family: "Fraunces", serif; font-weight: 900; font-size: 36px; letter-spacing: -0.02em; }
  @media (min-width: 640px) { .stat-value { font-size: 48px; } }
  .stat-label {
    margin-top: 8px; font-family: "Space Mono", monospace; font-size: 11px;
    text-transform: uppercase; letter-spacing: .15em; color: var(--muted-fg);
  }

  /* ---------- Sections ---------- */
  .section { padding: 80px 0; }
  @media (min-width: 640px) { .section { padding: 112px 0; } }
  .section.band { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: hsl(0 0% 100% / 0.4); }
  .section-head { max-width: 48rem; margin-bottom: 48px; }
  .section-eyebrow {
    margin-bottom: 12px; font-family: "Space Mono", monospace; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .15em; color: var(--accent);
  }
  .section-title {
    font-family: "Fraunces", serif; font-weight: 900;
    font-size: 30px; line-height: 1.05; letter-spacing: -0.02em;
  }
  @media (min-width: 640px) { .section-title { font-size: 48px; } }
  .section-intro { margin-top: 16px; font-size: 16px; line-height: 1.625; color: var(--muted-fg); }
  @media (min-width: 640px) { .section-intro { font-size: 18px; } }

  .two-col { display: grid; gap: 40px; }
  @media (min-width: 1024px) { .two-col { grid-template-columns: repeat(12, 1fr); } .span-7 { grid-column: span 7; } .span-5 { grid-column: span 5; } .span-8 { grid-column: span 8; } .span-4 { grid-column: span 4; } }

  /* Profile */
  .prose { display: grid; gap: 20px; font-size: 16px; line-height: 1.625; color: hsl(222 32% 11% / 0.8); }
  @media (min-width: 640px) { .prose { font-size: 18px; } }
  .card {
    border: 1px solid var(--border); background: var(--card);
    border-radius: 16px; padding: 24px;
  }
  @media (min-width: 640px) { .card { padding: 28px; } }
  .card-label {
    margin-bottom: 16px; font-family: "Space Mono", monospace; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .15em; color: var(--muted-fg);
  }
  .bullet-list { display: grid; gap: 12px; }
  .bullet-list li { display: flex; align-items: flex-start; gap: 12px; font-size: 14px; font-weight: 600; }
  .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--accent); flex-shrink: 0; margin-top: 7px; }

  /* Roles */
  .band-bg { background: hsl(0 0% 100% / 0.4); }
  .grid-3 { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .grid-3 { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } }
  .role {
    display: flex; flex-direction: column; height: 100%;
    border: 1px solid var(--border); background: var(--background);
    border-radius: 12px; padding: 20px; transition: border-color .3s, box-shadow .3s;
  }
  @media (min-width: 640px) { .role { padding: 24px; } }
  .role:hover { border-color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .role-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .idx { font-family: "Space Mono", monospace; font-size: 12px; font-weight: 700; color: var(--accent); }
  .role h3 { font-family: "Fraunces", serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .role p { margin-top: 8px; font-size: 14px; line-height: 1.625; color: var(--muted-fg); }

  /* Experience */
  .stack { display: grid; gap: 20px; }
  .exp { border: 1px solid var(--border); background: var(--card); border-radius: 16px; padding: 24px; }
  @media (min-width: 640px) { .exp { padding: 32px; } }
  .exp-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  .exp h3 { font-family: "Fraunces", serif; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  @media (min-width: 640px) { .exp h3 { font-size: 24px; } }
  .period {
    font-family: "Space Mono", monospace; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .15em; color: var(--accent);
  }
  .exp-org { margin-top: 4px; font-size: 14px; font-weight: 600; color: hsl(222 32% 11% / 0.7); }
  .exp ul { margin-top: 20px; display: grid; gap: 12px; }
  .exp li { display: flex; align-items: flex-start; gap: 12px; font-size: 14px; line-height: 1.625; color: hsl(222 32% 11% / 0.8); }
  @media (min-width: 640px) { .exp li { font-size: 16px; } }
  .exp li .dot { margin-top: 9px; }

  /* Projects */
  .grid-proj { display: grid; gap: 20px; }
  @media (min-width: 1024px) { .grid-proj { grid-template-columns: repeat(3, 1fr); } }
  .proj {
    display: flex; flex-direction: column; height: 100%;
    border: 1px solid var(--border); background: var(--background);
    border-radius: 16px; padding: 24px; transition: border-color .3s, box-shadow .3s;
  }
  .proj:hover { border-color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .proj-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .proj-period { font-family: "Space Mono", monospace; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .15em; color: var(--muted-fg); }
  .proj h3 { font-family: "Fraunces", serif; font-size: 18px; font-weight: 700; line-height: 1.375; letter-spacing: -0.01em; }
  .proj-tags { margin-top: 8px; font-family: "Space Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .15em; color: hsl(186 52% 30% / 0.9); }
  .proj p { margin-top: 16px; font-size: 14px; line-height: 1.625; color: var(--muted-fg); }

  /* Skills */
  .grid-2 { display: grid; gap: 20px; }
  @media (min-width: 768px) { .grid-2 { grid-template-columns: repeat(2, 1fr); } }
  .skill-card h3 { margin-bottom: 16px; font-family: "Fraunces", serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    border: 1px solid var(--border); background: var(--background);
    border-radius: 999px; padding: 6px 12px;
    font-size: 12px; font-weight: 600; color: hsl(222 32% 11% / 0.8);
    transition: border-color .2s, color .2s;
  }
  .tag:hover { border-color: var(--accent); color: var(--accent); }

  /* Education */
  .timeline { position: relative; display: grid; gap: 20px; border-left: 1px solid var(--border); padding-left: 24px; }
  .timeline li { position: relative; }
  .timeline .node {
    position: absolute; left: calc(-24px - 6px); top: 6px;
    width: 12px; height: 12px; border-radius: 999px;
    background: var(--accent); border: 2px solid var(--background);
  }
  .edu-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
  .edu-head h3 { font-family: "Fraunces", serif; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  @media (min-width: 640px) { .edu-head h3 { font-size: 18px; } }
  .edu-period { font-family: "Space Mono", monospace; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .15em; color: var(--muted-fg); }
  .edu-org { margin-top: 4px; font-size: 14px; font-weight: 600; color: hsl(222 32% 11% / 0.7); }
  .cert {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border: 1px solid var(--border); background: var(--background);
    border-radius: 12px; padding: 16px;
  }
  .cert + .cert { margin-top: 12px; }
  .cert p:first-child { font-size: 14px; font-weight: 700; }
  .cert p:last-child { font-family: "Space Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .15em; color: var(--muted-fg); margin-top: 2px; }
  .cert .ic-lg { color: var(--accent); }
  .lead-card { border: 1px solid var(--border); background: var(--background); border-radius: 12px; padding: 16px; }
  .lead-card + .lead-card { margin-top: 12px; }
  .lead-card p:first-child { font-size: 14px; font-weight: 700; }
  .lead-card p:last-child { margin-top: 4px; font-size: 14px; line-height: 1.625; color: var(--muted-fg); }

  /* Languages & interests */
  .lang-grid { display: grid; gap: 12px; }
  @media (min-width: 640px) { .lang-grid { grid-template-columns: repeat(2, 1fr); } }
  .lang {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border: 1px solid var(--border); background: var(--card);
    border-radius: 12px; padding: 12px 16px;
  }
  .lang p:first-child { font-size: 14px; font-weight: 700; }
  .lang p:last-child { font-family: "Space Mono", monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .15em; color: var(--muted-fg); }
  .level {
    border: 1px solid var(--border); background: var(--background);
    border-radius: 999px; padding: 4px 12px;
    font-family: "Space Mono", monospace; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .15em; color: var(--accent); white-space: nowrap;
  }
  .interest { border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 12px 16px; font-size: 14px; font-weight: 600; }
  .interest + .interest { margin-top: 12px; }

  /* Contact */
  .contact { position: relative; overflow: hidden; border-top: 1px solid var(--border); background: var(--foreground); color: var(--background); }
  .halftone-accent {
    position: absolute; inset: 0; pointer-events: none; opacity: .4;
    background-image: radial-gradient(hsl(186 52% 30% / 0.22) 1px, transparent 1.5px);
    background-size: 7px 7px;
  }
  .contact-inner { position: relative; padding: 96px 0; }
  @media (min-width: 640px) { .contact-inner { padding: 128px 0; } }
  .contact .section-eyebrow { color: var(--accent); }
  .contact h2 { font-family: "Fraunces", serif; font-weight: 900; font-size: 40px; line-height: 1.02; letter-spacing: -0.02em; }
  @media (min-width: 640px) { .contact h2 { font-size: 60px; } }
  .contact-lede { margin-top: 20px; max-width: 36rem; font-size: 16px; line-height: 1.625; color: hsl(38 33% 97% / 0.75); }
  @media (min-width: 640px) { .contact-lede { font-size: 18px; } }
  .contact-cards { margin-top: 40px; display: grid; gap: 16px; }
  @media (min-width: 640px) { .contact-cards { grid-template-columns: repeat(3, 1fr); } }
  .contact-card {
    display: flex; align-items: center; gap: 12px; min-width: 0;
    border: 1px solid hsl(38 33% 97% / 0.2); background: hsl(38 33% 97% / 0.05);
    border-radius: 12px; padding: 16px 20px; transition: background .2s;
  }
  a.contact-card:hover { background: hsl(38 33% 97% / 0.1); }
  .contact-card .ic-lg { color: var(--accent); }
  .contact-card .meta { min-width: 0; }

      <div class="reveal" style="--d:0.15s">
        <div class="contact-actions">
          <a class="btn-pill btn-accent" href="mailto:${CONFIG.email}">${icon("mail", "ic")} Send an email ${icon("arrow-up-right", "ic")}</a>
          <a class="btn-pill btn-ghost-light" href="#top">${icon("arrow-up", "ic")} Back to top</a>
        </div>
      </div>
    </div>
  </section>`;
}

function footer() {
  return `

      <nav class="footer-nav">

/* =====================================================================
   BEHAVIOUR
   ===================================================================== */
if (window.lucide) lucide.createIcons();

// Mobile menu
const sheet = document.getElementById("sheet");
const overlay = document.getElementById("overlay");
const menuBtn = document.getElementById("menuBtn");
function setMenu(open) {
  sheet.classList.toggle("open", open);
  overlay.classList.toggle("open", open);
  sheet.setAttribute("aria-hidden", String(!open));
  menuBtn.setAttribute("aria-expanded", String(open));
}
menuBtn.addEventListener("click", () => setMenu(true));
document.getElementById("closeBtn").addEventListener("click", () => setMenu(false));
overlay.addEventListener("click", () => setMenu(false));
sheet.querySelectorAll("[data-close]").forEach((a) => a.addEventListener("click", () => setMenu(false)));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });

// Reveal on scroll (once)
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const revealIO = new IntersectionObserver((entries) => {
  entries.forEach((en) => {
    if (en.isIntersecting) {
      en.target.classList.add("in");
      revealIO.unobserve(en.target);
    }
  });
}, { rootMargin: "0px 0px -60px 0px" });
document.querySelectorAll(".reveal").forEach((el) => {
  if (reduce) el.classList.add("in");
  else revealIO.observe(el);
});
// Scroll progress bar + floating back-to-top button
const progressBar = document.getElementById("progressBar");
const toTop = document.getElementById("toTop");
function updateScroll() {
  const doc = document.documentElement;
  const max = doc.scrollHeight - doc.clientHeight;
  const p = max > 0 ? Math.min(window.scrollY / max, 1) : 0;
  progressBar.style.transform = `scaleX(${p})`;
  toTop.classList.toggle("show", window.scrollY > 400);
}
let scrollTicking = false;
window.addEventListener("scroll", () => {
  if (scrollTicking) return;
  scrollTicking = true;
  requestAnimationFrame(() => { updateScroll(); scrollTicking = false; });
}, { passive: true });
window.addEventListener("resize", updateScroll);
toTop.addEventListener("click", () => {
  window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
});
updateScroll();
// Count-up stats
const EASE = (p) => 1 - Math.pow(1 - p, 3);
document.querySelectorAll("[data-count]").forEach((el) => {
  const target = Number(el.dataset.count);
  const suffix = el.dataset.suffix || "";
  if (reduce) { el.textContent = target + suffix; return; }
  const io = new IntersectionObserver(([entry]) => {
    if (!entry.isIntersecting) return;
    io.disconnect();
    const start = performance.now();
    const tick = (now) => {
      const p = Math.min((now - start) / 1600, 1);
      el.textContent = Math.round(target * EASE(p)) + suffix;
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }, { threshold: 0.3 });
  io.observe(el);
});
</script>
